# Standalone local API demo. No model weights or GPU runtime required.
services:
  gateway:
    image: vllm-verifier:${VERIFIER_IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${VERIFIER_HTTP_PORT:-8080}:8080"
    environment:
      VERIFIER_BASE_URL: http://demo-engine:8000/v1
      VERIFIER_MODEL: demo-uniform
      VERIFIER_API_KEY: ${VERIFIER_API_KEY:-local-demo-key}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      demo-engine:
        condition: service_healthy
    restart: unless-stopped
  demo-engine:
    image: vllm-verifier-demo:${VERIFIER_IMAGE_TAG:-local}
    build:
      context: ./examples/demo
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
